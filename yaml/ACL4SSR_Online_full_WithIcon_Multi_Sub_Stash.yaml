    tolerance: 50

  - name: VL-高级-英国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_Kingdom.png
    include-all: true
    filter: '(?i)^VL-.*(英国|英國|伦敦|倫敦|UK|GB|Great Britain|Britain|United Kingdom|England|London)-[^0-9]'
    type: url-test
    interval: 300
    tolerance: 50

  - name: EIX-英国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_Kingdom.png
    include-all: true
    filter: '(?i)^EIX-.*(英国|英國|伦敦|倫敦|[^A-Za-z]UK[^A-Za-z]|[^A-Za-z]GB[^A-Za-z]|Great Britain|Britain|United Kingdom|England|London)'
    type: url-test
    interval: 300
    tolerance: 50

  - name: PRPR-英国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_Kingdom.png
    include-all: true
    filter: '(?i)^PRPR-.*(英国|英國|伦敦|倫敦|UK|GB|Great Britain|Britain|United Kingdom|England|London)'
    type: url-test
    interval: 300
    tolerance: 50

  - name: 奶昔-德国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Germany.png
    include-all: true
    filter: '(?i)^奶昔-.*(德国|德國|德意志|法兰克福|法蘭克福|柏林|[^A-Za-z]DE[^A-Za-z]|Germany|German|Frankfurt|Berlin)'
    type: url-test
    interval: 300
    tolerance: 50

  - name: VL-高级-德国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Germany.png
    include-all: true
    filter: '(?i)^VL-.*(德国|德國|德意志|法兰克福|法蘭克福|柏林|(^|[^A-Za-z0-9])DE|Germany|German|Frankfurt|Berlin)-[^0-9]'
    type: url-test
    interval: 300
    tolerance: 50

  - name: EIX-德国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Germany.png
    include-all: true
    filter: '(?i)^EIX-.*(德国|德國|德意志|法兰克福|法蘭克福|柏林|[^A-Za-z]DE[^A-Za-z]|Germany|German|Frankfurt|Berlin)'
    type: url-test
    interval: 300
    tolerance: 50

  - name: PRPR-德国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Germany.png
    include-all: true
    filter: '(?i)^PRPR-.*(德国|德國|德意志|法兰克福|法蘭克福|柏林|DE|Germany|German|Frankfurt|Berlin)'
    type: url-test
    interval: 300
    tolerance: 50

  - name: 奶昔-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^奶昔-'
    interval: 300
    tolerance: 50

  - name: EIX-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^EIX-'
    interval: 300
    tolerance: 50

  - name: VL-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^VL-[^-]*-[0-9]'
    interval: 300
    tolerance: 50

  - name: VL-高级-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^VL-[^-]*-[^0-9]'
    interval: 300
    tolerance: 50
  
  - name: PRPR-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^PRPR-'
    interval: 300
    tolerance: 50

  - name: 搅局者-All
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: url-test
    include-all: true
    filter: '(?i)^搅局者-'
    interval: 300
    tolerance: 50

  - name: Edge
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    include-all: true
    exclude-filter: '(?i)港|HK|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|[^A-Za-z]US[^A-Za-z]|[^A-Za-z]USA[^A-Za-z]|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|英国|英國|伦敦|倫敦|[^A-Za-z]UK[^A-Za-z]|[^A-Za-z]GB[^A-Za-z]|Great Britain|Britain|United Kingdom|England|London|德国|德國|德意志|法兰克福|法蘭克福|柏林|[^A-Za-z]DE[^A-Za-z]|Germany|German|Frankfurt|Berlin'
    type: select

  - name: Download
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
    type: load-balance
    proxies:
      - 搅局者-All
    interval: 300

  - name: Fallback
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: fallback
    proxies:
      - 奶昔-All
      - EIX-All
      - VL-高级-All
      - PRPR-All
      - VL-All
      - 搅局者-All
    interval: 300
    
  - name: GLOBAL
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    include-all: true
    type: select
    proxies:
      - 节点选择
      - 手动切换
      - 自动选择
      - 电报消息
      - AI
      - 油管视频
      - 奈飞视频
      - 巴哈姆特
      - 哔哩哔哩
      - EMBY
      - 国外媒体
      - 国内媒体
      - 谷歌FCM
      - 微软云盘
      - 微软服务
      - 苹果服务
      - 谷歌服务
      - 游戏平台
      - 网易音乐
      - 全球直连
      - 广告拦截
      - 应用净化
      - 漏网之鱼
      - 香港-聚合
      - 香港
      - 日本-聚合
      - 日本
      - 美国-聚合
      - 美国
      - 狮城-聚合
      - 狮城
      - 台湾-聚合
      - 台湾
      - 德国-聚合
      - 德国
      - 英国
      - Edge
      - Download
      - Fallback

